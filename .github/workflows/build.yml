name: Android CI (APK Builder Bot)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Mock Assets for Compilation
      run: |
        # Since Jellyfin large binaries and assets are ignored by Git,
        # we mock them with empty files to allow compiler to build layouts/Kotlin.
        mkdir -p app/src/main/jniLibs/arm64-v8a
        touch app/src/main/jniLibs/arm64-v8a/libjellyfin.so
        touch app/src/main/jniLibs/arm64-v8a/libld.so
        mkdir -p app/src/main/assets
        touch app/src/main/assets/jellyfin_assets.zip

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: JellyfinServer-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
